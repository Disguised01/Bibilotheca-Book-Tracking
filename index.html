<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amit's Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Crimson Pro', serif;
            background-color: #0c0a09;
            color: #d1c7b7;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(61, 43, 31, 0.15), transparent),
                url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }
        .cinzel { font-family: 'Cinzel', serif; }

        .shelf-container {
            perspective: 2000px;
            margin-bottom: 12rem;
        }

        .shelf {
            position: relative;
            height: 32px;
            background: #23160d;
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
            box-shadow:
                0 30px 60px rgba(0,0,0,0.9),
                inset 0 1px 1px rgba(255,255,255,0.05);
            z-index: 10;
            border-bottom: 5px solid #140d08;
        }

        .shelf::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 0;
            width: 100%;
            height: 50px;
            background: #1a100a;
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            transform: rotateX(80deg);
            transform-origin: bottom;
            box-shadow: inset 0 -30px 60px rgba(0,0,0,1);
        }

        .book-case {
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 0 4rem;
            min-height: 340px;
            gap: 6px;
            margin-bottom: -8px;
            z-index: 20;
        }

        /* High-End Archival Spine */
        .book {
            position: relative;
            width: 54px;
            height: 260px;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            transform-origin: bottom;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            border-radius: 2px 3px 3px 2px;
            
            background-image:
                linear-gradient(90deg,
                    rgba(0,0,0,0.4) 0%,
                    rgba(255,255,255,0.04) 15%,
                    transparent 50%,
                    rgba(0,0,0,0.05) 85%,
                    rgba(0,0,0,0.5) 100%
                ),
                url('https://www.transparenttextures.com/patterns/stardust.png');
            
            box-shadow:
                5px 0 15px rgba(0,0,0,0.8),
                inset 1px 0 2px rgba(255,255,255,0.03);
        }

        .book:hover {
            transform: translateY(-45px) translateZ(30px);
            z-index: 100;
            box-shadow: 30px 50px 70px rgba(0,0,0,1);
        }

        .book:not(.read) {
            height: 275px;
            box-shadow: 8px 0 25px rgba(0,0,0,0.9);
        }

        .book.read {
            height: 245px;
            opacity: 0.8;
            filter: saturate(0.8) brightness(0.7);
        }

        .book:not(.read)::before {
            content: '';
            position: absolute;
            top: -12px;
            right: 10px;
            width: 12px;
            height: 35px;
            background: linear-gradient(135deg, #d4af37, #f9f295, #b8860b);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 85%, 0 100%);
            z-index: 5;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .spine-author {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: 'Cinzel', serif;
            font-size: 0.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            color: rgba(212, 175, 55, 0.7);
            height: 30px;
            display: flex;
            align-items: center;
        }

        .spine-title-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 2px;
            max-height: 180px;
            overflow: hidden;
            width: 100%;
        }

        .spine-title {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: 'Crimson Pro', serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #f1e7d8;
            white-space: normal;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            max-height: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.1;
        }

        #book-info-card {
            position: fixed;
            pointer-events: none;
            opacity: 0;
            z-index: 1000;
            width: 280px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateY(10px);
        }

        #book-info-card.active {
            opacity: 1;
            transform: translateY(0);
        }

        .info-card-inner {
            background: rgba(20, 15, 12, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .info-card-author {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            color: #d4af37;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .info-card-title {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #f1e7d8;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .info-card-notes {
            font-family: 'Crimson Pro', serif;
            font-size: 0.9rem;
            color: rgba(209, 199, 183, 0.8);
            font-style: italic;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            padding-top: 12px;
            min-height: 40px;
        }

        .status-badge {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .spine-deco {
            height: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            opacity: 0.3;
        }

        .gold-dash {
            width: 25px;
            height: 1px;
            background: #d4af37;
        }

        /* Premium Colors */
        .cloth-oxblood { background-color: #3b0a0a; }
        .cloth-ink { background-color: #0f141a; }
        .cloth-forest { background-color: #121f16; }
        .cloth-deep-teal { background-color: #0a2529; }
        .cloth-slate { background-color: #2b333a; }
        .cloth-espresso { background-color: #1a1412; }
        .cloth-royal { background-color: #141e3c; }

        .glass-panel {
            background: rgba(15, 12, 10, 0.9);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 40px 80px rgba(0,0,0,0.7);
        }

        .input-scholarly {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(224, 213, 197, 0.2);
            color: #e0d5c5;
        }
    </style>
</head>
<body class="min-h-[1000px] py-12 px-4 md:px-8">

    <div id="book-info-card">
        <div class="info-card-inner">
            <div id="card-author" class="info-card-author"></div>
            <div id="card-title" class="info-card-title"></div>
            <div id="card-notes" class="info-card-notes"></div>
            <div class="mt-4">
                <span id="card-status" class="status-badge"></span>
            </div>
        </div>
    </div>

    <header class="max-w-5xl mx-auto text-center mb-16">
        <h1 class="cinzel text-5xl md:text-7xl font-bold mb-4 text-[#e0d5c5]">Amit's Library</h1>
        <div id="read-stats" class="cinzel text-[#c5a67c]">6 / 14 read</div>
    </header>

    <main class="max-w-6xl mx-auto">
        <section class="shelf-container">
            <div class="book-case">
                <div class="book read cloth-oxblood">
                    <div class="spine-author">Plato</div>
                    <div class="spine-title-container"><span class="spine-title">Republic</span></div>
                    <div class="spine-deco"><div class="gold-dash"></div></div>
                </div>
                <!-- Add more books here... -->
            </div>
            <div class="shelf"></div>
        </section>
    </main>

    <script>
        document.querySelectorAll('.book').forEach(book => {
            book.addEventListener('click', function() {
                this.classList.toggle('read');
                updateStats();
                if (activeBook === this) updateTooltip(this);
            });
            book.addEventListener('mouseenter', e => showTooltip(book, e));
            book.addEventListener('mousemove', e => positionTooltip(e));
            book.addEventListener('mouseleave', () => hideTooltip());
        });

        const tooltip = document.getElementById('book-info-card');
        const cardAuthor = document.getElementById('card-author');
        const cardTitle = document.getElementById('card-title');
        const cardNotes = document.getElementById('card-notes');
        const cardStatus = document.getElementById('card-status');
        let activeBook = null;

        function showTooltip(book, e) {
            activeBook = book;
            updateTooltip(book);
            tooltip.classList.add('active');
            positionTooltip(e);
        }

        function updateTooltip(book) {
            const author = book.querySelector('.spine-author').innerText;
            const title = book.querySelector('.spine-title').innerText;
            cardAuthor.innerText = author;
            cardTitle.innerText = title;
            cardStatus.innerText = book.classList.contains('read') ? 'Read' : 'Unread';
            const savedNotes = localStorage.getItem(`note_${title}_${author}`);
            cardNotes.innerText = savedNotes || "No personal notes recorded for this volume.";
        }

        function positionTooltip(e) {
            tooltip.style.left = `${e.clientX + 20}px`;
            tooltip.style.top = `${e.clientY - 20}px`;
        }

        function hideTooltip() {
            tooltip.classList.remove('active');
            activeBook = null;
        }

        function updateStats() {
            const read = document.querySelectorAll('.book.read').length;
            const total = document.querySelectorAll('.book').length;
            document.getElementById('read-stats').innerText = `${read} / ${total} read`;
        }
    </script>
</body>
</html>
