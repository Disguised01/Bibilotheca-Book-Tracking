<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amit's Library</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IM+Fell+English:ital@0;1&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --wood-dark: #3D2B1F;
    --wood-mid:  #6B4C35;
    --wood-light:#A0734F;
    --paper:     #F2E8D5;
    --paper-aged:#E8D9C0;
    --ink:       #1C1410;
    --ink-soft:  #4A3728;
    --ink-faint: #8B7355;
    --gold:      #C9A84C;
    --gold-dim:  #8B7340;
    --shelf-shadow: rgba(20,10,5,0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--wood-dark);
    background-image:
      repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(255,255,255,0.015) 3px, rgba(255,255,255,0.015) 6px),
      repeating-linear-gradient(180deg, transparent, transparent 40px, rgba(0,0,0,0.04) 40px, rgba(0,0,0,0.04) 41px);
    min-height: 100vh;
    font-family: 'Crimson Pro', Georgia, serif;
    color: var(--ink);
    padding: 0 0 80px;
  }

  /* ── Header ── */
  .library-header {
    background: linear-gradient(180deg, #1A0F08 0%, #2B1A10 60%, #3D2410 100%);
    border-bottom: 4px solid var(--wood-light);
    padding: 40px 24px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .library-header::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, transparent, transparent 8px, rgba(255,255,255,0.012) 8px, rgba(255,255,255,0.012) 9px);
  }
  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 10px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--gold-dim); margin-bottom: 12px;
  }
  h1 {
    font-family: 'IM Fell English', serif;
    font-size: clamp(28px, 6vw, 52px); font-weight: 400;
    color: var(--paper); letter-spacing: .02em; line-height: 1.1; margin-bottom: 6px;
  }
  .sub { font-style: italic; font-size: 15px; color: #9A8060; margin-bottom: 24px; }

  .progress-wrap { max-width: 420px; margin: 0 auto; }
  .progress-track { height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 2px; transition: width .6s ease; }
  .progress-label { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--gold-dim); text-align: center; }

  .header-btns { display: flex; gap: 8px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .hbtn {
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    background: transparent; color: var(--gold-dim); border: 1px solid var(--gold-dim);
    padding: 7px 18px; border-radius: 2px; cursor: pointer; transition: all .2s;
  }
  .hbtn:hover { background: var(--gold-dim); color: var(--wood-dark); }
  .hbtn label { cursor: pointer; }
  #importFile { display: none; }

  /* ── Room ── */
  .room { max-width: 940px; margin: 0 auto; padding: 40px 16px; }

  /* ── Empty state ── */
  .empty-state {
    text-align: center; padding: 60px 20px;
    font-family: 'IM Fell English', serif; font-style: italic;
    color: #6B5540; font-size: 18px; line-height: 1.8;
  }
  .empty-state span { display: block; font-family: 'Space Mono', monospace; font-size: 11px; margin-top: 12px; color: #4A3820; letter-spacing: .1em; }

  /* ── Shelf unit ── */
  .shelf-unit { margin-bottom: 52px; }
  .shelf-label { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; padding: 0 4px; flex-wrap: wrap; }
  .shelf-label-title { font-family: 'IM Fell English', serif; font-size: 19px; color: var(--paper); font-style: italic; }
  .shelf-label-count { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--gold-dim); letter-spacing: .1em; }
  .shelf-label-desc { font-size: 12px; color: #6B5540; font-style: italic; margin-left: auto; }

  .shelf {
    position: relative;
    background: linear-gradient(180deg, #5C3D28 0%, #4A3020 40%, #3D2818 100%);
    border-radius: 2px 2px 0 0;
    padding: 18px 12px 0;
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 3px;
    min-height: 130px;
  }
  .shelf::after {
    content: ''; position: absolute; bottom: -14px; left: -6px; right: -6px;
    height: 14px;
    background: linear-gradient(180deg, var(--wood-mid) 0%, var(--wood-dark) 100%);
    border-radius: 0 0 3px 3px; box-shadow: 0 4px 12px var(--shelf-shadow); z-index: 2;
  }
  .shelf::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    border-radius: 2px 2px 0 0;
  }
  .shelf-empty-hint {
    font-family: 'Space Mono', monospace; font-size: 10px; color: #4A3020;
    align-self: center; letter-spacing: .08em; padding: 8px;
  }

  /* ── Book spine ── */
  .book-spine {
    position: relative; border-radius: 2px 2px 0 0;
    cursor: pointer; transition: transform .18s ease, filter .18s ease;
    flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: inset -2px 0 4px rgba(0,0,0,0.3), inset 2px 0 3px rgba(255,255,255,0.08), 2px 0 8px rgba(0,0,0,0.4);
  }
  .book-spine:hover { transform: translateY(-10px); filter: brightness(1.12); z-index: 10; }
  .book-spine.done { filter: brightness(0.52) saturate(0.35); }
  .book-spine.done:hover { filter: brightness(0.65) saturate(0.45); }
  .book-spine.done::after {
    content: '✓'; position: absolute; top: 6px;
    font-size: 11px; color: rgba(255,255,255,0.65); font-family: 'Space Mono', monospace;
  }
  .book-spine::before {
    content: ''; position: absolute; top: 8px; left: 4px; right: 4px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent); opacity: 0.5;
  }
  .spine-text {
    writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
    font-family: 'Crimson Pro', serif; font-size: 11px; font-weight: 600;
    color: rgba(255,255,255,0.88); text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-height: 86px; pointer-events: none; padding: 4px 0;
  }
  .spine-author {
    writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
    font-family: 'Crimson Pro', serif; font-size: 9px; font-weight: 300;
    color: rgba(255,255,255,0.45); letter-spacing: .05em;
    position: absolute; bottom: 7px; pointer-events: none;
  }

  /* 8 colour palettes cycling by shelf index */
  .sc0 { background: linear-gradient(180deg,#9B3535,#6B1E1E); }
  .sc1 { background: linear-gradient(180deg,#35659B,#1E3F6B); }
  .sc2 { background: linear-gradient(180deg,#35826B,#1E5443); }
  .sc3 { background: linear-gradient(180deg,#82652E,#5C4420); }
  .sc4 { background: linear-gradient(180deg,#5E3582,#3B1E5C); }
  .sc5 { background: linear-gradient(180deg,#828235,#5C5C1E); }
  .sc6 { background: linear-gradient(180deg,#358282,#1E5C5C); }
  .sc7 { background: linear-gradient(180deg,#72400F,#4A2908); }

  /* ── Card tooltip ── */
  .book-card {
    display: none; position: fixed; z-index: 200; width: 260px;
    background: var(--paper-aged); border: 1px solid #C4A97A;
    border-radius: 4px; padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .book-card.visible { display: block; }
  .card-title { font-family: 'IM Fell English', serif; font-size: 17px; font-style: italic; color: var(--ink); margin-bottom: 2px; }
  .card-author { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--ink-soft); letter-spacing: .06em; margin-bottom: 8px; text-transform: uppercase; }
  .card-note { font-size: 13px; font-style: italic; color: var(--ink-soft); border-top: 1px solid #C4A97A; padding-top: 8px; margin-top: 4px; line-height: 1.5; }
  .card-status { font-family: 'Space Mono', monospace; font-size: 10px; margin-top: 10px; color: var(--ink-faint); }
  .card-hint { font-family: 'Space Mono', monospace; font-size: 9px; color: #9A8060; margin-top: 6px; letter-spacing: .05em; }

  /* ── Manage panel ── */
  .manage-section { margin-top: 60px; padding: 0 4px; }
  .manage-title { font-family: 'IM Fell English', serif; font-size: 22px; color: var(--paper); font-style: italic; margin-bottom: 4px; }
  .manage-sub { font-size: 12px; color: #6B5540; font-style: italic; margin-bottom: 24px; }

  .tier-manage { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; margin-bottom: 12px; overflow: hidden; }
  .tier-manage-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: rgba(0,0,0,0.2); cursor: pointer;
    font-family: 'Crimson Pro', serif; font-size: 15px; color: var(--paper); user-select: none;
  }
  .tier-manage-head .tog { font-size: 11px; color: var(--gold-dim); }
  .tier-manage-body { display: none; padding: 12px 14px; }
  .tier-manage-body.open { display: block; }

  .bmr {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; color: #C4A97A;
  }
  .bmr:last-of-type { border-bottom: none; }
  .bmr input[type=checkbox] { width:14px; height:14px; accent-color: var(--gold); cursor:pointer; flex:none; }
  .bmr-text { flex:1; }
  .bmr-text.struck { text-decoration: line-through; opacity:.45; }
  .bmr-del { background:none; border:none; color:#6B4530; cursor:pointer; font-size:14px; padding:0 4px; opacity:.6; }
  .bmr-del:hover { opacity:1; color:#C05040; }

  .add-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .add-row input {
    font-family:'Crimson Pro',serif; font-size:13px; padding:7px 10px;
    background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1);
    border-radius:3px; color:var(--paper); flex:1; min-width:90px;
  }
  .add-row input::placeholder { color:#6B5540; }
  .add-row input:focus { outline:none; border-color:var(--gold-dim); }
  .add-row button {
    font-family:'Space Mono',monospace; font-size:11px;
    background:var(--wood-mid); color:var(--paper-aged);
    border:none; padding:7px 12px; border-radius:3px; cursor:pointer; transition:background .2s;
  }
  .add-row button:hover { background:var(--wood-light); }

  .del-shelf-btn {
    font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.06em;
    background:none; border:1px solid #4A2010; color:#6B3020;
    padding:4px 10px; border-radius:2px; cursor:pointer; margin-top:10px; transition:all .2s;
  }
  .del-shelf-btn:hover { border-color:#C05040; color:#C05040; }

  .new-section-row { margin-top:20px; display:flex; gap:8px; flex-wrap:wrap; }
  .new-section-row input {
    font-family:'Crimson Pro',serif; font-size:14px; padding:9px 12px;
    background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1);
    border-radius:3px; color:var(--paper); flex:1; min-width:200px;
  }
  .new-section-row input::placeholder { color:#6B5540; }
  .new-section-row input:focus { outline:none; border-color:var(--gold-dim); }
  .new-section-row button {
    font-family:'Space Mono',monospace; font-size:11px;
    background:rgba(255,255,255,0.06); color:var(--gold-dim);
    border:1px solid var(--gold-dim); padding:9px 16px; border-radius:3px; cursor:pointer; transition:all .2s;
  }
  .new-section-row button:hover { background:var(--gold-dim); color:var(--wood-dark); }

  /* ── Toast ── */
  .toast {
    position:fixed; bottom:24px; right:24px;
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.08em;
    background:var(--wood-dark); color:var(--gold);
    border:1px solid var(--gold-dim); padding:8px 16px; border-radius:3px;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:999;
  }
  .toast.show { opacity:1; }

  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:var(--wood-dark); }
  ::-webkit-scrollbar-thumb { background:var(--wood-mid); border-radius:3px; }
</style>
</head>
<body>

<header class="library-header">
  <div class="eyebrow">Personal Collection</div>
  <h1>Amit's Library</h1>
  <p class="sub">Greeks to the present — hover a spine, click to toggle read</p>
  <p style="font-family:'Space Mono',monospace;font-size:9px;color:#4A3820;margin-top:4px;letter-spacing:.1em;">v3.3</p>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0 read</div>
  </div>
  <div class="header-btns">
    <button class="hbtn" onclick="exportBackup()">⬇ Export Backup</button>
    <span class="hbtn" style="position:relative;overflow:hidden;cursor:pointer;">
      ⬆ Import Backup
      <input type="file" accept=".json" onchange="importBackup(event)"
        style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;">
    </span>
  </div>
</header>

<div class="room">
  <div id="shelves"></div>

  <div class="manage-section">
    <div class="manage-title">Manage the Collection</div>
    <div class="manage-sub">Expand a shelf to add or remove books. Click any spine above to toggle read.</div>
    <div id="manageList"></div>
    <div class="new-section-row">
      <input type="text" id="newSectionInput" placeholder="New shelf name (e.g. Tier 9 — Indian Epistemology)">
      <input type="text" id="newSectionDesc" placeholder="Short description (optional)">
      <button onclick="addSection()">+ Add Shelf</button>
    </div>
  </div>
</div>

<div class="book-card" id="bookCard">
  <div class="card-title"  id="cardTitle"></div>
  <div class="card-author" id="cardAuthor"></div>
  <div class="card-note"   id="cardNote"></div>
  <div class="card-status" id="cardStatus"></div>
  <div class="card-hint">Click spine to mark read / unread</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── STORAGE KEY ─────────────────────────────────────────────────────────────
const KEY = 'amit-philosophy-library-v3';

// ─── LOAD / SAVE ─────────────────────────────────────────────────────────────
// No seed data. If localStorage is empty, library starts empty.
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return []; // empty — user populates via import or manual entry
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(data));
}

let data = load();

// ─── RENDER SHELVES ───────────────────────────────────────────────────────────
function renderShelves() {
  const container = document.getElementById('shelves');
  container.innerHTML = '';

  if (data.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        The shelves are bare.<br>Import your backup, or add a shelf below and start filling it.
        <span>⬆ IMPORT BACKUP — or — use the manage panel below</span>
      </div>`;
    updateProgress(0, 0);
    return;
  }

  let total = 0, done = 0;

  data.forEach((tier, ti) => {
    total += tier.books.length;
    done  += tier.books.filter(b => b.done).length;

    const unit = document.createElement('div');
    unit.className = 'shelf-unit';

    const doneCount = tier.books.filter(b => b.done).length;
    unit.innerHTML = `
      <div class="shelf-label">
        <span class="shelf-label-title">${esc(tier.title)}</span>
        <span class="shelf-label-count">${doneCount}/${tier.books.length}</span>
        ${tier.desc ? `<span class="shelf-label-desc">${esc(tier.desc)}</span>` : ''}
      </div>
      <div class="shelf" id="shelf-${ti}"></div>
    `;
    container.appendChild(unit);

    const shelf = unit.querySelector(`#shelf-${ti}`);

    if (tier.books.length === 0) {
      shelf.innerHTML = `<span class="shelf-empty-hint">empty shelf</span>`;
    }

    tier.books.forEach((book, bi) => {
      const spine = document.createElement('div');
      const h = 94 + ((bi * 13 + ti * 7) % 28);
      const w = 28 + ((bi * 5  + ti * 3) % 14);
      spine.className = `book-spine sc${ti % 8}${book.done ? ' done' : ''}`;
      spine.style.height = h + 'px';
      spine.style.width  = w + 'px';

      const shortTitle = book.title.length > 22 ? book.title.slice(0,20) + '…' : book.title;
      spine.innerHTML = `
        <span class="spine-text">${esc(shortTitle)}</span>
        <span class="spine-author">${esc(book.author.split(' ').pop())}</span>
      `;

      spine.addEventListener('mouseenter', e => showCard(e, book));
      spine.addEventListener('mousemove',  e => posCard(e));
      spine.addEventListener('mouseleave', hideCard);
      spine.addEventListener('click', () => {
        data[ti].books[bi].done = !data[ti].books[bi].done;
        save(); renderShelves(); renderManage(); updateProgress();
        toast(data[ti].books[bi].done ? 'Marked as read' : 'Unmarked');
      });

      shelf.appendChild(spine);
    });
  });

  updateProgress(total, done);
}

// ─── PROGRESS ────────────────────────────────────────────────────────────────
function updateProgress(total, done) {
  if (total === undefined) {
    total = data.reduce((s,t) => s + t.books.length, 0);
    done  = data.reduce((s,t) => s + t.books.filter(b=>b.done).length, 0);
  }
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${done} / ${total} read`;
}

// ─── CARD TOOLTIP ────────────────────────────────────────────────────────────
const card = document.getElementById('bookCard');

function showCard(e, book) {
  document.getElementById('cardTitle').textContent  = book.title;
  document.getElementById('cardAuthor').textContent = book.author;
  const noteEl = document.getElementById('cardNote');
  noteEl.textContent = book.note || '';
  noteEl.style.display = book.note ? 'block' : 'none';
  document.getElementById('cardStatus').textContent = book.done ? '✓ Read' : 'Not yet read';
  card.classList.add('visible');
  posCard(e);
}
function posCard(e) {
  const cw = 260, ch = card.offsetHeight || 160;
  const x = e.clientX + 16, y = e.clientY + 16;
  card.style.left = (x + cw > window.innerWidth  ? x - cw - 32 : x) + 'px';
  card.style.top  = (y + ch > window.innerHeight ? y - ch - 32 : y) + 'px';
}
function hideCard() { card.classList.remove('visible'); }

// ─── MANAGE PANEL ────────────────────────────────────────────────────────────
function renderManage() {
  const container = document.getElementById('manageList');
  container.innerHTML = '';

  data.forEach((tier, ti) => {
    const div  = document.createElement('div');
    div.className = 'tier-manage';

    const head = document.createElement('div');
    head.className = 'tier-manage-head';
    head.innerHTML = `<span>${esc(tier.title)}</span><span class="tog">▸ expand</span>`;

    const body = document.createElement('div');
    body.className = 'tier-manage-body';

    head.addEventListener('click', () => {
      const open = body.classList.toggle('open');
      head.querySelector('.tog').textContent = open ? '▾ collapse' : '▸ expand';
    });

    // book rows
    tier.books.forEach((book, bi) => {
      const row = document.createElement('div');
      row.className = 'bmr';
      row.innerHTML = `
        <input type="checkbox" ${book.done?'checked':''}>
        <span class="bmr-text${book.done?' struck':''}">${esc(book.author)} — ${esc(book.title)}</span>
        <button class="bmr-del" title="Remove">✕</button>
      `;
      row.querySelector('input').addEventListener('change', ev => {
        data[ti].books[bi].done = ev.target.checked;
        save(); renderShelves(); renderManage(); updateProgress();
      });
      row.querySelector('.bmr-del').addEventListener('click', () => {
        if (!confirm(`Remove "${book.title}"?`)) return;
        data[ti].books.splice(bi, 1);
        save(); renderShelves(); renderManage(); updateProgress();
      });
      body.appendChild(row);
    });

    // add-book row
    const addRow = document.createElement('div');
    addRow.className = 'add-row';
    addRow.innerHTML = `
      <input placeholder="Author" class="ai" type="text">
      <input placeholder="Title"  class="ti" type="text">
      <input placeholder="Note (optional)" class="ni" type="text">
      <button>Add</button>
    `;
    const ai = addRow.querySelector('.ai');
    const ti2 = addRow.querySelector('.ti');
    const ni = addRow.querySelector('.ni');
    const doAdd = () => {
      const a = ai.value.trim(), t = ti2.value.trim();
      if (!a || !t) return;
      data[ti].books.push({ author:a, title:t, note:ni.value.trim(), done:false });
      save(); renderShelves(); renderManage(); updateProgress();
      ai.value = ti2.value = ni.value = '';
      toast('Added to shelf');
    };
    addRow.querySelector('button').addEventListener('click', doAdd);
    [ai, ti2, ni].forEach(inp => inp.addEventListener('keydown', e => { if(e.key==='Enter') doAdd(); }));
    body.appendChild(addRow);

    // delete shelf
    const delBtn = document.createElement('button');
    delBtn.className = 'del-shelf-btn';
    delBtn.textContent = 'Delete this shelf';
    delBtn.addEventListener('click', () => {
      if (!confirm(`Delete entire shelf "${tier.title}"? This cannot be undone.`)) return;
      data.splice(ti, 1);
      save(); renderShelves(); renderManage(); updateProgress();
      toast('Shelf removed');
    });
    body.appendChild(delBtn);

    div.appendChild(head);
    div.appendChild(body);
    container.appendChild(div);
  });
}

// ─── ADD SECTION ─────────────────────────────────────────────────────────────
function addSection() {
  const nameInp = document.getElementById('newSectionInput');
  const descInp = document.getElementById('newSectionDesc');
  const name = nameInp.value.trim();
  if (!name) return;
  data.push({ title:name, desc:descInp.value.trim(), books:[] });
  nameInp.value = descInp.value = '';
  save(); renderShelves(); renderManage();
  toast('New shelf added');
}

// ─── EXPORT / IMPORT ─────────────────────────────────────────────────────────
function exportBackup() {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type:'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `amits-library-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Backup downloaded');
}

function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!Array.isArray(imported)) throw new Error('bad format');
      if (!confirm('Replace current library with this backup?')) return;
      data = imported;
      save(); renderShelves(); renderManage(); updateProgress();
      toast('Library restored');
    } catch(err) {
      alert('Invalid file. Use a backup exported from this app.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => el.classList.remove('show'), 1600);
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ─── INIT ────────────────────────────────────────────────────────────────────
renderShelves();
renderManage();
</script>
</body>
</html>
